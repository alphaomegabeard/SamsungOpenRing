name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build SamsungOpenRing APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SamsungOpenRing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungOpenRing-APK
          path: SamsungOpenRing-debug.apk
          if-no-files-found: error
          retention-days: 30
